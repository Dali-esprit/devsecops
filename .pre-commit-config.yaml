repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        entry: powershell -NoProfile -Command "$staged = Join-Path $env:TEMP 'gitleaks-staged'; Remove-Item $staged -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Path $staged | Out-Null; git diff --cached --name-only --diff-filter=ACMR | ForEach-Object { $dest = Join-Path $staged $_; $dir = Split-Path $dest -Parent; New-Item -ItemType Directory -Path $dir -Force | Out-Null; git show (':'+$_) | Set-Content -NoNewline $dest }; docker run --rm -v ('{0}:/src/staged' -f $staged) -v ('{0}/.gitleaks.toml:/src/.gitleaks.toml' -f (Get-Location)) zricethezav/gitleaks:latest dir /src/staged --config=/src/.gitleaks.toml --exit-code 1"
        language: system
        pass_filenames: false

      - id: semgrep
        name: Semgrep Security Scan
        entry: powershell -NoProfile -Command "docker run --rm -v ${PWD}:/src semgrep/semgrep semgrep scan --config p/owasp-top-ten /src/hardened-app"
        language: system
        pass_filenames: false

      - id: eslint-security
        name: ESLint Security
        entry: powershell -NoProfile -Command "Set-Location hardened-app; npx.cmd eslint ."
        language: system
        pass_filenames: false