name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  APP_DIR: hardened-app
  IMAGE_NAME: devsecops/hardened-app

jobs:

  secrets_scan:
    name: Secrets Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/src" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/src \
            --config=/src/.gitleaks.toml \
            --report-format=json \
            --report-path=/src/reports/gitleaks.json \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json


  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: secrets_scan

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/owasp-top-ten \
            --json \
            --output=/src/reports/semgrep.json \
            /src/hardened-app

      - name: Enforce SAST quality gate
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/owasp-top-ten \
            --error \
            /src/hardened-app

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep.json


  scan_dependencies:
    name: SCA - Trivy Dependencies
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate dependency report
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /src/reports/trivy-sca.json \
            /src/hardened-app

      - name: Enforce SCA quality gate
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            /src/hardened-app

      - name: Upload Trivy SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: reports/trivy-sca.json


  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: scan_dependencies

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t $IMAGE_NAME:ci \
            $APP_DIR

      - name: Save image
        run: |
          docker save $IMAGE_NAME:ci -o hardened-app-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: hardened-app-image
          path: hardened-app-image.tar


  docker_scan:
    name: Docker Image Scan - Trivy
    runs-on: ubuntu-latest
    needs: docker_build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: hardened-app-image

      - name: Load Docker image
        run: |
          docker load -i hardened-app-image.tar

      - name: Generate image vulnerability report
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" \
            aquasec/trivy:latest \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /src/reports/trivy-image.json \
            $IMAGE_NAME:ci

      - name: Enforce Docker security gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            $IMAGE_NAME:ci

      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: reports/trivy-image.json


  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: docker_scan

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: hardened-app-image

      - name: Load Docker image
        run: |
          docker load -i hardened-app-image.tar

      - name: Start application
        run: |
          docker run -d \
            --name hardened-app \
            -p 3000:3000 \
            $IMAGE_NAME:ci

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done
          echo "Application did not start."
          docker logs hardened-app
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm \
            --network host \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J zap-report.json \
            -r zap-report.html \
            -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: reports/

      - name: Stop application
        if: always()
        run: |
          docker rm -f hardened-app || true


  notify_slack:
    name: Notify Slack
    if: >-
      ${{
        always() &&
        (
          needs.secrets_scan.result == 'failure' ||
          needs.sast.result == 'failure' ||
          needs.scan_dependencies.result == 'failure' ||
          needs.docker_build.result == 'failure' ||
          needs.docker_scan.result == 'failure' ||
          needs.dast.result == 'failure'
        )
      }}
    needs:
      - secrets_scan
      - sast
      - scan_dependencies
      - docker_build
      - docker_scan
      - dast
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="[SECURITY] DevSecOps pipeline FAILED in ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"${MESSAGE}\"}" \
            "$SLACK_WEBHOOK_URL"
